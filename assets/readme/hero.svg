<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">课本插图转真人照片 — 99 组原图与照片风格版本对照</title>
  <desc id="desc">米白底标题：课本插图转真人照片；右侧是两张交错的卡片，前一张是扁平插画风的山与太阳，标着原图，后一张是写实照片风的风景，标着转换后。</desc>

  <rect width="1200" height="360" rx="26" fill="#faf9f5"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#9c4a2c">TEXTBOOK IMAGE LAB · 99 PAIRED SAMPLES</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#141413">课本插图转真人照片</text>
    <text x="56" y="168" font-size="23" fill="#3d3d3a">99 组原图与照片风格版本对照</text>
    <text x="56" y="204" font-size="19" fill="#57534e">同一条提示词，验证它在不同插图上的稳定性。</text>
    <g id="chips" font-size="18" fill="#3d3d3a" text-anchor="middle">
      <g><rect x="56" y="238" width="108" height="36" rx="18" fill="#ffffff" stroke="#d1cfc5" stroke-width="1.5"/><text x="110" y="262">99 组对照</text></g>
      <g><rect x="176" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d1cfc5" stroke-width="1.5"/><text x="239" y="262">统一提示词</text></g>
      <g><rect x="314" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d1cfc5" stroke-width="1.5"/><text x="377" y="262">单文件站点</text></g>
      <g><rect x="452" y="238" width="180" height="36" rx="18" fill="#ffffff" stroke="#d1cfc5" stroke-width="1.5"/><text x="542" y="262">灯箱 + 提示词复制</text></g>
    </g>
  </g>

  <g id="before-after-motif">
    <g id="card-source" transform="rotate(-5 905 170)">
      <rect x="830" y="70" width="150" height="200" rx="10" fill="#ffffff" stroke="#d1cfc5" stroke-width="1.5"/>
      <rect x="842" y="116" width="126" height="140" fill="#f0eee6"/>
      <circle cx="930" cy="146" r="16" fill="#d97757"/>
      <polygon points="842,256 884,196 916,236 942,206 968,256" fill="#788c5d"/>
      <g id="tag-source" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
        <rect x="842" y="82" width="52" height="26" rx="6" fill="#141413"/>
        <text x="868" y="100" font-size="16" fill="#ffffff" text-anchor="middle">原图</text>
      </g>
    </g>
    <g id="card-photo" transform="rotate(4 1035 190)">
      <rect x="960" y="90" width="150" height="200" rx="10" fill="#ffffff" stroke="#d1cfc5" stroke-width="1.5"/>
      <rect x="972" y="136" width="126" height="140" fill="#a8c5d6"/>
      <rect x="972" y="216" width="126" height="60" fill="#8a9a7b"/>
      <circle cx="1002" cy="166" r="14" fill="#e8dcc8"/>
      <polygon points="972,276 1010,226 1032,252 1052,232 1098,276" fill="#5d6e52"/>
      <g id="tag-photo" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
        <rect x="972" y="102" width="70" height="26" rx="6" fill="#b85c3e"/>
        <text x="1007" y="120" font-size="16" fill="#ffffff" text-anchor="middle">转换后</text>
      </g>
    </g>
  </g>
</svg>
